<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Think Technologies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0E0E0E; --text: #F5F1EE; --muted: #A29A94;
    --accent: #C0330F; --border: rgba(255,255,255,.12);
    --grad: linear-gradient(135deg, #E8814F, #C0330F);
    --font: 'Poppins', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--ink); color: var(--text); min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .card { width: 100%; max-width: 400px; text-align: center; }
  .logo { display: flex; justify-content: center; margin-bottom: 28px; }
  .logo .mark { font: 800 30px/1 var(--font); letter-spacing: -1px; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 6px 20px rgba(192,51,15,.4)); }
  .logo .mark b { -webkit-text-fill-color: #F5F1EE; color: #F5F1EE; }
  h1 { font: 700 22px/1.25 var(--font); margin-bottom: 8px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 30px; line-height: 1.6; }
  form { display: flex; flex-direction: column; gap: 12px; }
  input { width: 100%; background: rgba(255,255,255,.05); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; font: 400 15px/1 var(--font); color: var(--text); outline: none; }
  input::placeholder { color: #6F6862; }
  input:focus { border-color: rgba(232,129,79,.6); }
  button { border: none; border-radius: 999px; padding: 15px 20px; font: 600 15px/1 var(--font); color: #fff; background: var(--grad); cursor: pointer; box-shadow: 0 10px 26px -8px rgba(192,51,15,.6); transition: transform .12s; }
  button:hover { transform: translateY(-1px); }
  button:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  .msg { margin-top: 18px; font-size: 14px; line-height: 1.6; padding: 14px 16px; border-radius: 12px; display: none; }
  .msg.ok { display: block; background: rgba(31,122,77,.12); border: 1px solid rgba(31,122,77,.35); color: #7BD3A6; }
  .msg.err { display: block; background: rgba(192,51,15,.12); border: 1px solid rgba(192,51,15,.4); color: #F0975E; }
  .foot { margin-top: 30px; font-size: 12.5px; color: #6F6862; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo"><div class="mark">[<b>think</b>]</div></div>
    <h1>Sign in to your portal</h1>
    <p class="sub">Enter your email and we’ll send you a secure sign-in link. No password needed.</p>
    <form id="loginForm">
      <input id="email" type="email" placeholder="you@company.com" autocomplete="email" required>
      <button type="submit" id="sendBtn">Send sign-in link</button>
    </form>
    <div class="msg" id="msg"></div>
    <div class="foot">Think Technologies · Client Portal</div>
  </div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
  const sb = createClient('https://gnhuwffzttgriyjjbfyf.supabase.co', 'sb_publishable_-T3_xSvBTJNxFrqxRE-1Sw_bcsQYLs9');

  const form = document.getElementById('loginForm');
  const emailEl = document.getElementById('email');
  const btn = document.getElementById('sendBtn');
  const msg = document.getElementById('msg');
  const show = (t, c) => { msg.textContent = t; msg.className = 'msg ' + c; };

  // Already signed in? Send them into the portal.
  const { data: { session } } = await sb.auth.getSession();
  if (session) location.replace('index.html');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = emailEl.value.trim();
    if (!email) return;
    btn.disabled = true; btn.textContent = 'Sending…';
    const { error } = await sb.auth.signInWithOtp({
      email,
      options: { emailRedirectTo: location.origin + '/index.html' }
    });
    btn.disabled = false; btn.textContent = 'Send sign-in link';
    if (error) { show(error.message, 'err'); return; }
    show('Check your inbox — we sent a sign-in link to ' + email + '. Click it to enter your portal.', 'ok');
    form.reset();
  });
</script>
</body>
</html>
