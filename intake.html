<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Work with Think Technologies — Intake</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --font: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --text: #141210;
    --muted: #5B5651;
    --surface: #FFFFFF;
    --surface-2: #F4F1EF;
    --border: #ECE7E4;
    --accent: #B33F2A;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: var(--font); color: var(--text); background: var(--surface-2); -webkit-font-smoothing: antialiased; }
  .top { background: #0E0E0E; color: #fff; padding: 26px 28px; }
  .top .brand { font-weight: 700; font-size: 22px; letter-spacing: -0.01em; }
  .top .brand span { color: #E06A50; }
  .wrap { max-width: 620px; margin: 0 auto; padding: 40px 20px 80px; }
  .eyebrow { display: inline-block; color: var(--accent); font-weight: 600; font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 10px; }
  h1 { font-size: 32px; line-height: 1.15; letter-spacing: -0.02em; margin: 0 0 10px; }
  .lede { color: var(--muted); font-size: 15px; line-height: 1.55; margin: 0 0 28px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 26px; }
  label { display: block; font-weight: 600; font-size: 13.5px; margin: 18px 0 7px; }
  label:first-of-type { margin-top: 0; }
  input, textarea { width: 100%; border: 1px solid var(--border); border-radius: 11px; padding: 12px 14px; font: 400 14px/1.5 var(--font); color: var(--text); background: var(--surface-2); outline: none; }
  input:focus, textarea:focus { border-color: #d9b2a8; }
  textarea { min-height: 120px; resize: vertical; }
  .hp { position: absolute; left: -9999px; opacity: 0; height: 0; overflow: hidden; }
  .btn { margin-top: 22px; width: 100%; border: 0; border-radius: 12px; padding: 14px; background: var(--accent); color: #fff; font: 600 15px var(--font); cursor: pointer; }
  .btn:disabled { opacity: 0.6; cursor: default; }
  .msg { margin-top: 14px; font-size: 14px; line-height: 1.5; display: none; }
  .msg.ok { display: block; color: #2c6e49; }
  .msg.err { display: block; color: var(--accent); }
  .done { text-align: center; padding: 30px 10px; }
  .done h2 { margin: 0 0 8px; font-size: 24px; }
  .done p { color: var(--muted); margin: 0; }
</style>
</head>
<body>
  <div class="top"><div class="brand">[think<span>]</span> Technologies</div></div>
  <div class="wrap">
    <span class="eyebrow">New client intake</span>
    <h1>Tell us where it hurts.</h1>
    <p class="lede">A few basics and one honest answer — that's all we need to figure out where AI and automation can actually move the needle for your business.</p>

    <div class="card" id="formCard">
      <label for="fName">Your name</label>
      <input id="fName" type="text" placeholder="Jane Doe" autocomplete="name">

      <label for="fCompany">Company</label>
      <input id="fCompany" type="text" placeholder="Acme Corp" autocomplete="organization">

      <label for="fEmail">Work email</label>
      <input id="fEmail" type="email" placeholder="jane@acme.com" autocomplete="email">

      <label for="fPain">What's the one thing in your business that eats the most time or causes the most frustration?</label>
      <textarea id="fPain" placeholder="e.g. Every deal lives in a different spreadsheet and nobody knows the latest status…"></textarea>

      <!-- honeypot: bots fill this, humans never see it -->
      <input class="hp" id="fWebsite" type="text" tabindex="-1" autocomplete="off">

      <button class="btn" id="fSubmit">Send it over →</button>
      <div class="msg" id="fMsg"></div>
    </div>

    <div class="card done" id="doneCard" hidden>
      <h2>Got it — thank you!</h2>
      <p>Someone from Think Technologies will reach out within a business day.</p>
    </div>
  </div>

<script>
  const INTAKE_WEBHOOK_URL = 'https://n8n.srv1000837.hstgr.cloud/webhook/think-intake';
  const $ = id => document.getElementById(id);
  const msg = $('fMsg');
  function showMsg(text, cls) { msg.textContent = text; msg.className = 'msg ' + cls; }

  $('fSubmit').addEventListener('click', async () => {
    const name = $('fName').value.trim();
    const company = $('fCompany').value.trim();
    const email = $('fEmail').value.trim();
    const painPoint = $('fPain').value.trim();
    if ($('fWebsite').value) return; // honeypot tripped — silently drop
    if (!name || !email || !painPoint) { showMsg('Please fill in your name, email, and the pain point — that’s the whole form.', 'err'); return; }
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { showMsg('That email doesn’t look right.', 'err'); return; }
    const btn = $('fSubmit');
    btn.disabled = true; btn.textContent = 'Sending…';
    try {
      await fetch(INTAKE_WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, company, email, painPoint })
      });
      $('formCard').hidden = true;
      $('doneCard').hidden = false;
    } catch (e) {
      btn.disabled = false; btn.textContent = 'Send it over →';
      showMsg('Something went wrong sending the form — please try again.', 'err');
    }
  });
</script>
</body>
</html>
